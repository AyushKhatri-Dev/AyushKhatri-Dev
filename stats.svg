<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="GitHub stats for AyushKhatri-Dev">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0b14"/><stop offset="1" stop-color="#12070d"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8325f"/><stop offset="1" stop-color="#ee7ea3"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="fr"><rect width="495" height="210" rx="16"/></clipPath></defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.row{opacity:0;animation:in .5s ease-out forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:fill 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.gw{animation:glow 2.4s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-495px)}60%,100%{transform:translateX(495px)}}
.sw{animation:sw 5s ease-in-out 1.5s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<g clip-path="url(#fr)"><rect width="495" height="210" fill="url(#bg)"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#ee7ea3">GitHub at a glance</text>
<g class="row" style="animation-delay:0.30s"><circle cx="30" cy="71" r="3.5" fill="#e6b567"/><text x="44" y="76" font-size="14" fill="#c9a9b4">Repos built</text><text x="300" y="76" text-anchor="end" font-size="14" font-weight="700" fill="#f6e7dc">27</text></g>
<g class="row" style="animation-delay:0.45s"><circle cx="30" cy="101" r="3.5" fill="#e6b567"/><text x="44" y="106" font-size="14" fill="#c9a9b4">Main language</text><text x="300" y="106" text-anchor="end" font-size="14" font-weight="700" fill="#f6e7dc">Python</text></g>
<g class="row" style="animation-delay:0.60s"><circle cx="30" cy="131" r="3.5" fill="#e6b567"/><text x="44" y="136" font-size="14" fill="#c9a9b4">Django PR merged</text><text x="300" y="136" text-anchor="end" font-size="14" font-weight="700" fill="#f6e7dc">#18837</text></g>
<g class="row" style="animation-delay:0.75s"><circle cx="30" cy="161" r="3.5" fill="#e6b567"/><text x="44" y="166" font-size="14" fill="#c9a9b4">Ideathon</text><text x="300" y="166" text-anchor="end" font-size="14" font-weight="700" fill="#f6e7dc">1st place</text></g>
<text x="24" y="194" font-size="11" fill="#8a6674">Counted by hand, Sep 2026</text>
<circle cx="400" cy="112" r="50" fill="none" stroke="#3a1828" stroke-width="9"/>
<circle cx="400" cy="112" r="50" fill="none" stroke="url(#bar)" stroke-width="9" stroke-linecap="round" stroke-dasharray="314.2" stroke-dashoffset="314.2" transform="rotate(-90 400 112)" filter="url(#gl)"><animate attributeName="stroke-dashoffset" from="314.2" to="31.4" dur="1.6s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></circle>
<text class="pop" style="animation-delay:1.2s" x="400" y="118" text-anchor="middle" font-size="24" font-weight="800" fill="#f6e7dc">27</text>
<text x="400" y="192" text-anchor="middle" font-size="12" fill="#c9a9b4">repos built</text>
</g><rect x=".75" y=".75" width="493.5" height="208.5" rx="15.5" fill="none" stroke="#4a1a2e" stroke-width="1.5"/></svg>