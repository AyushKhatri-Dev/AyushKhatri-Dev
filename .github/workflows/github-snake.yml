name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#c2416b&color_dots=#f6e4ea,#f0c3d2,#e08aa6,#c2416b,#8e2350
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ee7ea3&color_dots=#1f0d15,#4a1a2e,#7d1f45,#b8325f,#ee7ea3

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
