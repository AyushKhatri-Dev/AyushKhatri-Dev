<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Languages across my repos">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0b14"/><stop offset="1" stop-color="#12070d"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8325f"/><stop offset="1" stop-color="#ee7ea3"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="fr"><rect width="495" height="210" rx="16"/></clipPath></defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.row{opacity:0;animation:in .5s ease-out forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:fill 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.gw{animation:glow 2.4s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-495px)}60%,100%{transform:translateX(495px)}}
.sw{animation:sw 5s ease-in-out 1.5s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<g clip-path="url(#fr)"><rect width="495" height="210" fill="url(#bg)"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#ee7ea3">Languages across my repos</text>
<rect x="24" y="54" width="447" height="10" rx="5" fill="#3a1828"/>
<rect class="bar" style="animation-delay:0.30s" x="24.0" y="54" width="268.2" height="10" fill="#3572A5"/>
<rect class="bar" style="animation-delay:0.42s" x="292.2" y="54" width="71.5" height="10" fill="#e34c26"/>
<rect class="bar" style="animation-delay:0.54s" x="363.7" y="54" width="53.6" height="10" fill="#DA5B0B"/>
<rect class="bar" style="animation-delay:0.66s" x="417.4" y="54" width="17.9" height="10" fill="#663399"/>
<rect class="bar" style="animation-delay:0.78s" x="435.2" y="54" width="17.9" height="10" fill="#f1e05a"/>
<rect class="bar" style="animation-delay:0.90s" x="453.1" y="54" width="17.9" height="10" fill="#b07219"/>
<g class="row" style="animation-delay:0.90s"><circle cx="30" cy="93" r="5" fill="#3572A5"/><text x="44" y="98" font-size="14" fill="#f6e7dc">Python</text><text x="236" y="98" text-anchor="end" class="mono" font-size="12.5" fill="#c9a9b4">60%</text></g>
<g class="row" style="animation-delay:1.00s"><circle cx="264" cy="93" r="5" fill="#e34c26"/><text x="278" y="98" font-size="14" fill="#f6e7dc">HTML</text><text x="470" y="98" text-anchor="end" class="mono" font-size="12.5" fill="#c9a9b4">16%</text></g>
<g class="row" style="animation-delay:1.10s"><circle cx="30" cy="125" r="5" fill="#DA5B0B"/><text x="44" y="130" font-size="14" fill="#f6e7dc">Jupyter Notebook</text><text x="236" y="130" text-anchor="end" class="mono" font-size="12.5" fill="#c9a9b4">12%</text></g>
<g class="row" style="animation-delay:1.20s"><circle cx="264" cy="125" r="5" fill="#663399"/><text x="278" y="130" font-size="14" fill="#f6e7dc">CSS</text><text x="470" y="130" text-anchor="end" class="mono" font-size="12.5" fill="#c9a9b4">4%</text></g>
<g class="row" style="animation-delay:1.30s"><circle cx="30" cy="157" r="5" fill="#f1e05a"/><text x="44" y="162" font-size="14" fill="#f6e7dc">JavaScript</text><text x="236" y="162" text-anchor="end" class="mono" font-size="12.5" fill="#c9a9b4">4%</text></g>
<g class="row" style="animation-delay:1.40s"><circle cx="264" cy="157" r="5" fill="#b07219"/><text x="278" y="162" font-size="14" fill="#f6e7dc">Java</text><text x="470" y="162" text-anchor="end" class="mono" font-size="12.5" fill="#c9a9b4">4%</text></g>
<text x="24" y="194" font-size="11" fill="#8a6674">Main language of each of 25 own repos, forks excluded</text>
</g><rect x=".75" y=".75" width="493.5" height="208.5" rx="15.5" fill="none" stroke="#4a1a2e" stroke-width="1.5"/></svg>